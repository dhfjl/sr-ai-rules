name: Update Shadowrocket rules

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 北京时间每天 06:00（GitHub cron 用 UTC）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成规则
        run: python scripts/generate_rules.py

      - name: 有变化则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
          else
            git commit -m "chore: update rules $(date -u +%Y-%m-%d)"
            git push
          fi
